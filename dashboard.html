<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-SGP - Dashboard</title>
    
    <!-- Ícones -->
    <link rel="stylesheet" href="fonts/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-building"></i>
                </div>
                <div class="logo-text">
                    <h2>e-SGP</h2>
                </div>
            </div>

            <nav class="menu">
                <a href="dashboard.html" class="menu-item active">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="secretarias.html" class="menu-item">
                    <i class="fas fa-landmark"></i>
                    <span>Secretarias</span>
                </a>
                <a href="unidades.html" class="menu-item">
                    <i class="fas fa-school"></i>
                    <span>Unidades</span>
                </a>
                <a href="locais.html" class="menu-item">
                    <i class="fas fa-door-open"></i>
                    <span>Departamentos</span>
                </a>
                <a href="itens.html" class="menu-item">
                    <i class="fas fa-boxes"></i>
                    <span>Patrimônio</span>
                </a>
                <a href="responsaveis.html" class="menu-item">
                    <i class="fas fa-user-check"></i>
                    <span>Responsáveis</span>
                </a>
                <a href="inventarios.html" class="menu-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Inventários</span>
                </a>
                <a href="baixas.html" class="menu-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Baixas</span>
                </a>
                <a href="historicos.html" class="menu-item">
                    <i class="fas fa-history"></i>
                    <span>Histórico</span>
                </a>
            </nav>

            <div class="user-info">
                <div class="user-avatar">AD</div>
                <div class="user-details">
                    <h4>Admin</h4>
                    <p>admin@prefeitura.br</p>
                </div>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <header class="header">
                <div class="page-title">
                    <h1>Dashboard</h1>
                    <div class="breadcrumb">
                        <span>Início</span>
                        <i class="fas fa-chevron-right"></i>
                        <span>Dashboard</span>
                    </div>
                </div>
                <div class="date-display">
                    <i class="far fa-calendar-alt"></i>
                </div>
            </header>

            <div class="welcome-card">
                <h2>Bem-vindo!</h2>
                <p>Resumo do patrimônio municipal</p>
            </div>

            <div class="dashboard-empty">
                <p>Dashboard aguardando dados reais do sistema.</p>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="window.location.href='novo-item.html'">
                    <i class="fas fa-plus"></i> Novo Item
                </button>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/utils.js"></script>
</body>
</html>
