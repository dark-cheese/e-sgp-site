<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-SGP - Status do Sistema</title>
    <link rel="stylesheet" href="fonts/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .status-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        h1 { color: #333; margin-bottom: 25px; font-size: 24px; }
        .status-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; border-bottom: 1px solid #eee; }
        .status-item:last-child { border-bottom: none; }
        .status-label { font-size: 16px; color: #555; font-weight: bold; }
        .indicator { display: flex; align-items: center; gap: 10px; }
        .ball { width: 15px; height: 15px; border-radius: 50%; background-color: #777; transition: all 0.3s ease; }
        .status-text { font-size: 14px; font-weight: bold; color: #777; }
        
        /* Cores dos estados */
        .online { background-color: #007bff !important; box-shadow: 0 0 8px #007bff; } /* Azul para Online */
        .offline { background-color: #dc3545 !important; box-shadow: 0 0 8px #dc3545; } /* Vermelho para Offline */
        
        .btn-test { margin-top: 25px; padding: 10px 20px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; }
        .btn-test:hover { background: #555; }
    </style>
</head>
<body>

    <div class="status-card">
        <h1>Painel de Diagnóstico e-SGP</h1>
        
        <div class="status-item">
            <span class="status-label">Servidor Flask:</span>
            <div class="indicator">
                <span id="text-server" class="status-text">Testando...</span>
                <div id="ball-server" class="ball"></div>
            </div>
        </div>

        <div class="status-item">
            <span class="status-label">Banco de Dados:</span>
            <div class="indicator">
                <span id="text-db" class="status-text">Aguardando...</span>
                <div id="ball-db" class="ball"></div>
            </div>
        </div>

        <button class="btn-test" onclick="verificarStatus()">Verificar Agora</button>
    </div>

    <script>
        async function verificarStatus() {
            const ballServer = document.getElementById('ball-server');
            const textServer = document.getElementById('text-server');
            const ballDb = document.getElementById('ball-db');
            const textDb = document.getElementById('text-db');

            // Resetando para o estado de teste
            ballServer.className = 'ball'; textServer.innerText = 'Testando...'; textServer.style.color = '#777';
            ballDb.className = 'ball'; textDb.innerText = 'Aguardando...'; textDb.style.color = '#777';

            try {
                // Faz a requisição para a nossa nova rota de checagem na raiz do site
                const response = await fetch('/api/healthcheck');
                
                if (!response.ok) {
                    throw new Error('Erro HTTP ' + response.status);
                }

                const data = await response.json();

                // 1. Validando o Servidor (Se respondeu o JSON, ele está online!)
                ballServer.classList.add('online');
                textServer.innerText = 'ONLINE';
                textServer.style.color = '#007bff';

                // 2. Validando o Banco de Dados baseado na resposta do Flask
                if (data.database === 'online') {
                    ballDb.classList.add('online');
                    textDb.innerText = 'ONLINE';
                    textDb.style.color = '#007bff';
                } else {
                    ballDb.classList.add('offline');
                    textDb.innerText = 'FORA DO AR';
                    textDb.style.color = '#dc3545';
                    alert('Aviso: O Flask está online, mas o Banco de Dados retornou erro:\n' + data.error);
                }

            } catch (error) {
                // Se cair aqui, o próprio servidor Flask está inacessível ou desligado
                ballServer.classList.add('offline');
                textServer.innerText = 'FORA DO AR';
                textServer.style.color = '#dc3545';

                ballDb.classList.add('offline');
                textDb.innerText = 'INACESSÍVEL';
                textDb.style.color = '#dc3545';
                
                alert('Erro de Conexão: Não foi possível alcançar o servidor Flask.\nMotivo: ' + error.message);
            }
        }

        // Executa automaticamente ao abrir a página
        window.onload = verificarStatus;
    </script>
</body>
</html>
