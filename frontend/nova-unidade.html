<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-SGP - Nova Unidade</title>
    
    <!-- Ícones -->
    <link rel="stylesheet" href="../fonts/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-title {
            font-size: 20px;
            color: var(--azul-escuro);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-title i {
            color: var(--azul);
        }
        
        .btn-back {
            background: var(--cinza);
            color: white;
        }
        
        .btn-back:hover {
            background: var(--cinza-escuro);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-building"></i>
                </div>
                <div class="logo-text">
                    <h2>e-SGP</h2>
                </div>
            </div>

            <nav class="menu">
                <a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a>
                <a href="secretarias.html" class="menu-item"><i class="fas fa-landmark"></i> Secretarias</a>
                <a href="unidades.html" class="menu-item active"><i class="fas fa-school"></i> Unidades</a>
                <a href="locais.html" class="menu-item"><i class="fas fa-door-open"></i> Locais</a>
                <a href="itens.html" class="menu-item"><i class="fas fa-boxes"></i> Patrimônio</a>
            </nav>

            <div class="user-info">
                <div class="user-avatar">AD</div>
                <div>
                    <h4>Admin</h4>
                    <p style="font-size: 11px;">admin@prefeitura.br</p>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Nova Unidade</h1>
                    <div class="breadcrumb">
                        <a href="unidades.html">Unidades</a>
                        <i class="fas fa-chevron-right"></i>
                        <span>Nova Unidade</span>
                    </div>
                </div>
            </header>

            <div class="card form-container">
                <div class="form-title">
                    <i class="fas fa-school"></i>
                    <h2>Cadastrar Nova Unidade</h2>
                </div>
                
                <form onsubmit="event.preventDefault(); salvarUnidade()">
                    <div class="form-group">
                        <label>Nome da Unidade *</label>
                        <input type="text" id="nome" placeholder="Ex: Escola Municipal Pedro Álvares" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Secretaria *</label>
                        <select id="secretaria" required>
                            <option value="">Selecione uma secretaria...</option>
                            <option value="1">Educação</option>
                            <option value="2">Saúde</option>
                            <option value="3">Obras</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Endereço</label>
                        <input type="text" id="endereco" placeholder="Rua, número, bairro...">
                    </div>
                    
                    <div class="form-group">
                        <label>Responsável</label>
                        <input type="text" id="responsavel" placeholder="Nome do responsável">
                    </div>
                    
                    <div class="form-actions">
                        <button type="button" class="btn btn-back" onclick="window.location.href='unidades.html'">
                            <i class="fas fa-arrow-left"></i> Voltar
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Salvar
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        function salvarUnidade() {
            const nome = document.getElementById('nome').value;
            const secretaria = document.getElementById('secretaria').value;
            
            if (!nome) {
                alert('Por favor, preencha o nome da unidade!');
                return;
            }
            
            if (!secretaria) {
                alert('Por favor, selecione uma secretaria!');
                return;
            }
            
            alert(`Unidade "${nome}" cadastrada com sucesso!`);
            window.location.href = 'unidades.html';
        }
    </script>
    
    <script src="../js/main.js"></script>
</body>
</html>
