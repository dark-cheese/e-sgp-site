<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-SGP - Secretarias</title>
    
    <!-- Ícones -->
    <link rel="stylesheet" href="../fonts/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/secretarias.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-building"></i>
                </div>
                <div class="logo-text">
                    <h2>e-SGP</h2>
                </div>
            </div>

            <nav class="menu">
                <a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a>
                <a href="secretarias.html" class="menu-item active"><i class="fas fa-landmark"></i> Secretarias</a>
                <a href="unidades.html" class="menu-item"><i class="fas fa-school"></i> Unidades</a>
                <a href="locais.html" class="menu-item"><i class="fas fa-door-open"></i> Locais</a>
                <a href="itens.html" class="menu-item"><i class="fas fa-boxes"></i> Patrimônio</a>
            </nav>

            <div class="user-info">
                <div class="user-avatar">AD</div>
                <div>
                    <h4>Admin</h4>
                    <p style="font-size: 11px;">admin@prefeitura.br</p>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Secretarias</h1>
                    <div class="breadcrumb">
                        <span>Início</span>
                        <i class="fas fa-chevron-right"></i>
                        <span>Secretarias</span>
                    </div>
                </div>
                <button class="btn btn-primary" onclick="window.location.href='nova-secretaria.html'">
                    <i class="fas fa-plus"></i> Nova
                </button>
            </header>

            <div class="filter-section">
                <div class="filter-row">
                    <input type="text" placeholder="Buscar secretaria...">
                    <button class="btn btn-primary">Buscar</button>
                </div>
            </div>

            <div class="stats-summary">
                <div class="card">
                    <div class="stat-number">6</div>
                    <p>Total de Secretarias</p>
                </div>
                <div class="card">
                    <div class="stat-number">28</div>
                    <p>Unidades</p>
                </div>
                <div class="card">
                    <div class="stat-number">1.234</div>
                    <p>Itens</p>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Secretaria</th>
                        <th>Unidades</th>
                        <th>Itens</th>
                        <th>Responsável</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><i class="fas fa-graduation-cap" style="color: var(--azul); margin-right: 8px;"></i> Educação</td>
                        <td>8</td>
                        <td>543</td>
                        <td>João Silva</td>
                        <td>
                            <button class="action-btn" onclick="window.location.href='unidades.html'"><i class="fas fa-eye"></i></button>
                            <button class="action-btn"><i class="fas fa-edit"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td><i class="fas fa-hospital" style="color: var(--azul); margin-right: 8px;"></i> Saúde</td>
                        <td>5</td>
                        <td>345</td>
                        <td>Maria Santos</td>
                        <td>
                            <button class="action-btn" onclick="window.location.href='unidades.html'"><i class="fas fa-eye"></i></button>
                            <button class="action-btn"><i class="fas fa-edit"></i></button>
                        </td>
                    </tr>
                    <tr>
                        <td><i class="fas fa-hard-hat" style="color: var(--azul); margin-right: 8px;"></i> Obras</td>
                        <td>3</td>
                        <td>198</td>
                        <td>Pedro Oliveira</td>
                        <td>
                            <button class="action-btn" onclick="window.location.href='unidades.html'"><i class="fas fa-eye"></i></button>
                            <button class="action-btn"><i class="fas fa-edit"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="pagination">
                <button class="page-btn"><i class="fas fa-chevron-left"></i></button>
                <button class="page-btn active">1</button>
                <button class="page-btn">2</button>
                <button class="page-btn">3</button>
                <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
        </main>
    </div>

    <script src="../js/main.js"></script>
    <script src="../js/utils.js"></script>
</body>
</html>
