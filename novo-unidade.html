<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-SGP - Nova Unidade</title>
    <link rel="stylesheet" href="fonts/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .form-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .form-title {
            font-size: 20px;
            color: var(--azul-escuro);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-title i {
            color: var(--azul);
        }
        .btn-back {
            background: var(--cinza);
            color: white;
        }
        .btn-back:hover {
            background: var(--cinza-escuro);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-building"></i></div>
                <div class="logo-text"><h2>e-SGP</h2></div>
            </div>
            <nav class="menu">
                <a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a>
                <a href="secretarias.html" class="menu-item"><i class="fas fa-landmark"></i> Secretarias</a>
                <a href="unidades.html" class="menu-item active"><i class="fas fa-school"></i> Unidades</a>
                <a href="locais.html" class="menu-item"><i class="fas fa-door-open"></i> Departamentos</a>
                <a href="itens.html" class="menu-item"><i class="fas fa-boxes"></i> Patrimônio</a>
                <a href="responsaveis.html" class="menu-item"><i class="fas fa-user-check"></i> Responsáveis</a>
                <a href="inventarios.html" class="menu-item"><i class="fas fa-clipboard-list"></i> Inventários</a>
                <a href="baixas.html" class="menu-item"><i class="fas fa-file-alt"></i> Baixas</a>
                <a href="historicos.html" class="menu-item"><i class="fas fa-history"></i> Histórico</a>
            </nav>
            <div class="user-info">
                <div class="user-avatar">AD</div>
                <div>
                    <h4>Admin</h4>
                    <p style="font-size: 11px;">admin@prefeitura.br</p>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <header class="header">
                <div class="page-title">
                    <h1>Nova Unidade</h1>
                    <div class="breadcrumb">
                        <a href="unidades.html">Unidades</a>
                        <i class="fas fa-chevron-right"></i>
                        <span>Nova Unidade</span>
                    </div>
                </div>
                <div class="date-display"></div>
            </header>
            <div class="card form-container">
                <div class="form-title"><i class="fas fa-school"></i> Cadastrar nova unidade</div>
                <form onsubmit="event.preventDefault(); salvarUnidade()">
                    <div class="form-row-duas-colunas">
                        <div class="form-group">
                            <label>Nome da Unidade *</label>
                            <input type="text" id="nomeUnidade" placeholder="Ex: Escola Municipal Paulo Freire" required>
                        </div>
                        <div class="form-group">
                            <label>Secretaria *</label>
                            <select id="secretariaUnidade" required>
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row-duas-colunas">
                        <div class="form-group">
                            <label>Responsável</label>
                            <select id="responsavelUnidade">
                                <option value="">Selecione...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Endereço</label>
                            <input type="text" id="enderecoUnidade" placeholder="Ex: Rua das Flores, 123">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-back" onclick="window.location.href='unidades.html'"><i class="fas fa-arrow-left"></i> Voltar</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
        function getApiBaseUrl() { return '/api'; }

        document.addEventListener('DOMContentLoaded', function () {
            carregarSecretarias();
            carregarResponsaveis();
        });

        async function carregarSecretarias() {
            try {
                const response = await fetch(getApiBaseUrl() + '/secretarias');
                const data = await response.json();
                if (data.success && data.data) {
                    const select = document.getElementById('secretariaUnidade');
                    data.data.forEach(sec => {
                        const option = document.createElement('option');
                        option.value = sec.id;
                        option.textContent = sec.nome;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar secretarias:', error);
            }
        }

        async function carregarResponsaveis() {
            try {
                const response = await fetch(getApiBaseUrl() + '/responsaveis');
                const data = await response.json();
                if (data.success && data.data) {
                    const select = document.getElementById('responsavelUnidade');
                    data.data.forEach(resp => {
                        const option = document.createElement('option');
                        option.value = resp.id;
                        option.textContent = resp.nome;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar responsáveis:', error);
            }
        }

        async function salvarUnidade() {
            var nome = document.getElementById('nomeUnidade').value.trim();
            var secretariaId = document.getElementById('secretariaUnidade').value;
            var responsavelId = document.getElementById('responsavelUnidade').value;
            var endereco = document.getElementById('enderecoUnidade').value.trim();

            if (!nome || !secretariaId) {
                alert('Preencha os campos obrigatórios para cadastrar a unidade.');
                return;
            }

            try {
                const response = await fetch(getApiBaseUrl() + '/unidades', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome: nome,
                        secretariaId: parseInt(secretariaId),
                        responsavelId: responsavelId ? parseInt(responsavelId) : null,
                        endereco: endereco || null
                    })
                });

                if (!response.ok) {
                    throw new Error('Resposta inválida do servidor.');
                }

                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.message || 'Não foi possível cadastrar a unidade.');
                }

                alert(data.message);
                window.location.href = 'unidades.html';
            } catch (error) {
                console.error(error);
                alert('Erro ao salvar unidade:\n' + error.message);
            }
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
