services:
  - type: web
    name: e-sgp-site
    runtime: python
    runtimeVersion: "3.11"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
