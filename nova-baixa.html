<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-SGP - Nova Baixa</title>
    <link rel="stylesheet" href="fonts/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .form-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .form-title {
            font-size: 20px;
            color: var(--azul-escuro);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-title i {
            color: var(--azul);
        }
        .btn-back {
            background: var(--cinza);
            color: white;
        }
        .btn-back:hover {
            background: var(--cinza-escuro);
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-building"></i></div>
                <div class="logo-text"><h2>e-SGP</h2></div>
            </div>
            <nav class="menu">
                <a href="dashboard.html" class="menu-item"><i class="fas fa-home"></i> Dashboard</a>
                <a href="secretarias.html" class="menu-item"><i class="fas fa-landmark"></i> Secretarias</a>
                <a href="unidades.html" class="menu-item"><i class="fas fa-school"></i> Unidades</a>
                <a href="locais.html" class="menu-item"><i class="fas fa-door-open"></i> Departamentos</a>
                <a href="itens.html" class="menu-item"><i class="fas fa-boxes"></i> Patrimônio</a>
                <a href="responsaveis.html" class="menu-item"><i class="fas fa-user-check"></i> Responsáveis</a>
                <a href="inventarios.html" class="menu-item"><i class="fas fa-clipboard-list"></i> Inventários</a>
                <a href="baixas.html" class="menu-item active"><i class="fas fa-file-alt"></i> Baixas</a>
                <a href="historicos.html" class="menu-item"><i class="fas fa-history"></i> Histórico</a>
            </nav>
            <div class="user-info">
                <div class="user-avatar">AD</div>
                <div>
                    <h4>Admin</h4>
                    <p style="font-size: 11px;">admin@prefeitura.br</p>
                </div>
            </div>
        </aside>
        <main class="main-content">
            <header class="header">
                <div class="page-title">
                    <h1>Nova Baixa</h1>
                    <div class="breadcrumb">
                        <a href="baixas.html">Baixas</a>
                        <i class="fas fa-chevron-right"></i>
                        <span>Nova Baixa</span>
                    </div>
                </div>
                <div class="date-display"></div>
            </header>
            <div class="card form-container">
                <div class="form-title"><i class="fas fa-file-alt"></i> Registrar nova baixa</div>
                <form onsubmit="event.preventDefault(); salvarBaixa()">
                    <div class="form-row-duas-colunas">
                        <div class="form-group">
                            <label>Item *</label>
                            <select id="itemBaixa" required>
                                <option value="">Selecione um item...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Tipo de Baixa *</label>
                            <select id="tipoBaixa" required>
                                <option value="">Selecione...</option>
                                <option value="DOACAO">DOAÇÃO</option>
                                <option value="PERDA">PERDA</option>
                                <option value="CADASTRAMENTO_INDEVIDO">CADASTRAMENTO INDEVIDO</option>
                                <option value="INUTILIZACAO">DESCARTE</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row-duas-colunas">
                        <div class="form-group">
                            <label>Data *</label>
                            <input type="date" id="dataBaixa" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Justificativa *</label>
                        <textarea id="justificativaBaixa" placeholder="Motivo da baixa" rows="4" required></textarea>
                    </div>
                    <div class="form-group">
                        <label>Documento</label>
                        <input type="text" id="documentoBaixa" placeholder="Número do documento ou referência">
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn btn-back" onclick="window.location.href='baixas.html'"><i class="fas fa-arrow-left"></i> Voltar</button>
                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
        async function carregarItensBaixa() {
            try {
                const response = await fetch(getApiBaseUrl() + '/itens.php');
                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.message || 'Falha ao carregar itens.');
                }
                const itemSelect = document.getElementById('itemBaixa');
                itemSelect.innerHTML = '<option value="">Selecione um item...</option>';
                data.data.forEach(function (item) {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.numeroPatrimonio + ' — ' + item.descricao;
                    itemSelect.appendChild(option);
                });
            } catch (error) {
                console.error(error);
                alert('Erro ao carregar itens: ' + error.message);
            }
        }

        async function salvarBaixa() {
            var itemId = Number(document.getElementById('itemBaixa').value);
            var tipo = document.getElementById('tipoBaixa').value;
            var data = document.getElementById('dataBaixa').value;
            var justificativa = document.getElementById('justificativaBaixa').value.trim();
            var documento = document.getElementById('documentoBaixa').value.trim() || null;

            if (!itemId || !tipo || !data || !justificativa) {
                alert('Preencha todos os campos obrigatórios para registrar a baixa.');
                return;
            }

            try {
                const response = await fetch(getApiBaseUrl() + '/baixas.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        itemId: itemId,
                        tipo: tipo,
                        dataBaixa: data,
                        justificativa: justificativa,
                        documento: documento
                    })
                });

                const dataResponse = await response.json();
                if (!dataResponse.success) {
                    throw new Error(dataResponse.message || 'Não foi possível registrar a baixa.');
                }

                alert(dataResponse.message);
                window.location.href = 'baixas.html';
            } catch (error) {
                console.error(error);
                alert('Erro ao registrar baixa: ' + error.message);
            }
        }

        document.addEventListener('DOMContentLoaded', carregarItensBaixa);
    </script>
    <script src="js/main.js"></script>
</body>
</html>
